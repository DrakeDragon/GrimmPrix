<style>
:root{--cy:#19e6ff;--mg:#ff2fd0;--ink:#120a24;--ink2:#1f1240;--gold:#ffd86b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0b0618;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#game{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.hbox{position:absolute;background:rgba(18,10,36,.62);border:2px solid rgba(25,230,255,.7);border-radius:14px;padding:4px 10px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#hPos{top:8px;left:8px;font-size:clamp(22px,6vw,34px);color:var(--gold)}
#hPos small{font-size:.5em;color:#fff;opacity:.8}
#hLap{top:8px;left:50%;transform:translateX(-50%);font-size:clamp(13px,3.6vw,18px);text-align:center;line-height:1.15;border-color:rgba(255,47,208,.7)}
#hTime{display:block;font-size:.85em;opacity:.8;font-variant-numeric:tabular-nums}
#hItem{top:8px;right:8px;width:clamp(54px,14vw,72px);height:clamp(54px,14vw,72px);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vw,42px);padding:0;border-color:rgba(255,47,208,.8)}
#hItem.roll{animation:blink .15s infinite alternate}
@keyframes blink{to{background:rgba(255,47,208,.4)}}
#hBar{position:absolute;left:8px;top:calc(env(safe-area-inset-top) + 58px);width:clamp(90px,26vw,150px);height:8px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
#hBarFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg))}
#hDrift{position:absolute;left:8px;top:calc(env(safe-area-inset-top) + 70px);width:clamp(90px,26vw,150px);height:6px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
#hDriftFill{display:block;height:100%;width:0;background:var(--cy)}
#chesh{position:absolute;left:8px;right:56px;max-width:560px;transform:translateY(-8px);top:calc(env(safe-area-inset-top) + 86px);display:flex;gap:8px;align-items:flex-start;opacity:0;transition:opacity .25s,transform .25s}
#chesh.on{opacity:1;transform:translateY(0)}
#chesh .face{font-size:clamp(28px,8vw,40px);filter:drop-shadow(0 0 8px var(--mg));flex:none;line-height:1}
#cheshTxt{background:rgba(18,10,36,.85);border:2px solid var(--mg);border-radius:6px 16px 16px 16px;padding:7px 12px;font-size:clamp(13px,3.7vw,17px);font-weight:700;line-height:1.25;text-shadow:0 1px 0 #000}
#big{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;opacity:0;font-size:clamp(48px,min(18vw,20vh),120px);letter-spacing:2px;color:#fff;text-shadow:0 0 18px var(--mg),0 6px 0 rgba(0,0,0,.5);transform:scale(1);pointer-events:none}
#big.pop{animation:pop 1.25s ease-out forwards}
@keyframes pop{0%{transform:scale(2);opacity:0}20%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
#msg{position:absolute;left:0;right:0;top:46%;text-align:center;font-weight:900;font-size:clamp(22px,7vw,40px);color:var(--cy);text-shadow:0 0 12px var(--mg),0 3px 0 #000;opacity:0;transition:opacity .2s}
#msg.on{opacity:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.hbtn{position:absolute;pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(18,10,36,.6);border:2px solid rgba(255,255,255,.35);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0}
#hPause{top:calc(env(safe-area-inset-top) + 64px);right:8px;top:calc(env(safe-area-inset-top) + 86px)}
#hSnd{top:calc(env(safe-area-inset-top) + 132px);right:8px}

/* Touch controls */
#touch{position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:3px solid rgba(255,255,255,.55);background:rgba(18,10,36,.45);backdrop-filter:blur(2px);font-size:clamp(22px,6vw,34px);text-shadow:0 2px 0 #000}
.tb.down{background:rgba(25,230,255,.55);transform:scale(.94)}
.tb small{display:block;font-size:.38em;letter-spacing:1px}
#bL,#bR{bottom:calc(env(safe-area-inset-bottom) + 18px);width:clamp(74px,22vw,104px);height:clamp(74px,22vw,104px);border-radius:26px}
#bL{left:calc(env(safe-area-inset-left) + 12px)}
#bR{left:calc(env(safe-area-inset-left) + 24px + clamp(74px,22vw,104px))}
#bD,#bI{bottom:calc(env(safe-area-inset-bottom) + 18px);width:clamp(78px,23vw,110px);height:clamp(78px,23vw,110px);flex-direction:column;line-height:1}
#bI{right:calc(env(safe-area-inset-right) + 12px);border-color:var(--mg)}
#bD{right:calc(env(safe-area-inset-right) + 24px + clamp(78px,23vw,110px));border-color:var(--cy)}
#bD.down{background:rgba(25,230,255,.6)}
#bI.down{background:rgba(255,47,208,.6)}
#bI.ready{box-shadow:0 0 0 4px rgba(255,47,208,.35),0 0 22px var(--mg);animation:ready .6s infinite alternate}
@keyframes ready{to{transform:scale(1.07)}}

/* Screens */
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 30%,rgba(18,10,36,.35),rgba(11,6,24,.88));overflow-y:auto;touch-action:pan-y}
#screen.clear{background:rgba(11,6,24,.72)}
.panel{width:min(94vw,640px);margin:auto;text-align:center;padding:6px 0}
.logo{font-size:clamp(46px,15vw,92px);font-weight:900;line-height:.92;letter-spacing:1px;margin:0;background:linear-gradient(180deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(255,47,208,.5))}
.sub{font-size:clamp(13px,3.8vw,18px);opacity:.9;margin:8px 0 14px}
.grin{font-size:clamp(54px,16vw,96px);filter:drop-shadow(0 0 14px var(--mg));animation:float 2.4s ease-in-out infinite;line-height:1.1}
@keyframes float{50%{transform:translateY(-8px)}}
h2{margin:0 0 6px;font-size:clamp(22px,6.4vw,34px);text-shadow:0 0 12px var(--mg)}
.btn{display:block;width:min(86vw,360px);margin:10px auto 0;padding:14px 18px;border-radius:999px;font-weight:900;font-size:clamp(16px,4.6vw,21px);background:linear-gradient(90deg,var(--cy),var(--mg));color:#0b0618;box-shadow:0 5px 0 rgba(0,0,0,.45);letter-spacing:.5px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.btn.alt{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.4)}
.btn.sm{width:auto;display:inline-block;padding:10px 20px;font-size:15px;margin:10px 5px 0}
.tale{background:rgba(18,10,36,.82);border:2px solid var(--mg);border-radius:16px;padding:12px 14px;margin:12px auto;text-align:left;font-size:clamp(14px,4vw,17px);line-height:1.4}
.tale b{color:var(--cy)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(31,18,64,.88);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:8px 6px;text-align:center}
.card.sel{border-color:var(--cy);box-shadow:0 0 0 3px rgba(25,230,255,.35),0 0 18px rgba(25,230,255,.5);background:rgba(45,24,92,.95)}
.card .em{font-size:clamp(30px,9vw,44px);line-height:1.1}
.card .nm{font-weight:900;font-size:clamp(14px,3.9vw,17px)}
.card .vh{font-size:11px;opacity:.75;margin-bottom:4px;min-height:2.4em}
.st{display:flex;align-items:center;gap:4px;font-size:10px;margin:2px 4px;text-transform:uppercase;letter-spacing:.5px}
.st span{width:36px;text-align:left;opacity:.8}
.st i{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.st i b{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.quip{font-style:italic;color:var(--gold);min-height:1.4em;margin:10px 0 0;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:8px;background:rgba(18,10,36,.82);border-radius:14px;overflow:hidden}
td,th{padding:7px 8px;text-align:left;font-size:clamp(13px,3.8vw,16px)}
th{font-size:11px;text-transform:uppercase;opacity:.7}
tr.me td{background:rgba(25,230,255,.22);font-weight:900}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.help{text-align:left;font-size:14px;line-height:1.4}
.help p{margin:6px 0}
.help .it{display:flex;gap:8px;align-items:center;margin:4px 0}
.help .it span:first-child{font-size:26px;width:34px;text-align:center}
.tag{display:inline-block;background:var(--mg);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:900;margin-left:6px}
@media (max-height:480px){#cheshTxt{font-size:13px;padding:5px 10px}#chesh .face{font-size:26px}#chesh{top:calc(env(safe-area-inset-top) + 78px)}#hItem{width:54px;height:54px;font-size:28px}#big{top:20%}#msg{top:52%;font-size:20px}.tb{opacity:.9}}
#hud{z-index:3}#touch{z-index:2}#screen{z-index:5}
#zoneL{position:absolute;left:0;top:max(32%,190px);bottom:0;width:58%;pointer-events:auto;touch-action:none}
#zoneR{position:absolute;right:0;top:max(32%,190px);bottom:0;width:42%;pointer-events:auto;touch-action:none}
#zhint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 118px);text-align:center;font-weight:900;font-size:15px;letter-spacing:1px;color:#fff;opacity:.75;text-shadow:0 2px 0 #000;pointer-events:none}
#zhint.hide{display:none}
#stick{position:fixed;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:3px solid rgba(25,230,255,.7);background:rgba(25,230,255,.12);pointer-events:none;z-index:4}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--mg));border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 14px rgba(255,47,208,.7)}
#touch[data-scheme="slide"] #bL,#touch[data-scheme="slide"] #bR{display:none}
#touch[data-scheme="buttons"] #zoneL,#touch[data-scheme="buttons"] #zhint{display:none}
#touch[data-ad="1"] #bD{display:none}
#bI{width:clamp(92px,26vw,124px);height:clamp(92px,26vw,124px)}
#bD{right:calc(env(safe-area-inset-right) + 24px + clamp(92px,26vw,124px))}
</style>
<style>

.panel{padding:24px 14px}.logo{background:linear-gradient(180deg,#fff5d8 12%,#eac77e 53%,#a780d3);background-clip:text;-webkit-background-clip:text;letter-spacing:-2px;filter:drop-shadow(0 4px 12px #0008)}

</style>

#screen{background:linear-gradient(90deg,#0b101be8,#141324a8),url('assets/world/track-3.jpg') center/cover}#screen.clear{background:#0c1020c9}

<body>

  <canvas id="c"></canvas>

    <div id="hPos" class="hbox">1<small>st</small></div>

  <div id="touch" class="hide">
    <div id="zoneL"><div id="zhint">&#9664; SLIDE TO STEER &#9654;</div></div>

</div>
<script>
'use strict';
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIn=(a,b,p)=>a+(b-a)*p*p;
const easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+.5);
const pick=a=>a[(Math.random()*a.length)|0];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mixHex(a,b,t){const x=hex2rgb(a),y=hex2rgb(b);return'rgb('+((x[0]+(y[0]-x[0])*t)|0)+','+((x[1]+(y[1]-x[1])*t)|0)+','+((x[2]+(y[2]-x[2])*t)|0)+')';}
function withAlpha(c,a){let v;if(c[0]==='#')v=hex2rgb(c);else v=c.match(/[\d.]+/g).slice(0,3).map(Number);return'rgba('+v[0]+','+v[1]+','+v[2]+','+a+')';}
function fmtTime(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);}
function ordSfx(n){return n===1?'st':n===2?'nd':n===3?'rd':'th';}
function store(k,v){try{if(v===undefined){const s=localStorage.getItem('gp_'+k);return s?JSON.parse(s):null;}localStorage.setItem('gp_'+k,JSON.stringify(v));}catch(e){return null;}}

/* ============ constants ============ */
const SEG=200,RUMBLE=3,ROAD=2000,CAMH=1000,FOVD=100,DRAWN=190;
const CAMD=1/Math.tan((FOVD/2)*Math.PI/180);
const PLAYERZ=CAMH*CAMD;
const MAXS=12000,OFFLIM=MAXS/4,CARW=0.3,CARLEN=420;
const POINTS=[15,12,10,8,6,4];
const LAPS=3;

/* ============ racers ============ */
const RACERS=[
 {id:'gingy',name:'Gingerbread Man',full:'The Gingerbread Man',emoji:'🍪',veh:'Cookie-Cutter Dragster',body:'#c9792f',trim:'#fff3d6',shape:'rect',spd:3,acc:5,hnd:4,wt:1,quip:"Run, run, as fast as you can! (Mostly because of the oven.)"},
 {id:'cinder',name:'Cinderella',full:'Cinderella',emoji:'👸',veh:'Pumpkin Carriage',body:'#ff8a1f',trim:'#7be0ff',shape:'round',spd:4,acc:3,hnd:5,wt:2,quip:"Drifts like a dream. Falls apart at midnight. Allegedly."},
 {id:'wolf',name:'Big Bad Wolf',full:'The Big Bad Wolf',emoji:'🐺',veh:'Huff & Puff Hot Rod',body:'#6c7a89',trim:'#ff2fd0',shape:'rect',spd:5,acc:3,hnd:2,wt:4,quip:"Fast in a straight line. Corners are just suggestions."},
 {id:'pigs',name:'Three Pigs',full:'The Three Little Pigs',emoji:'🐷',veh:'Brick Truck',body:'#b5482f',trim:'#f0d9b5',shape:'truck',spd:2,acc:3,hnd:3,wt:5,quip:"Nobody is blowing this truck down. Nobody."},
 {id:'alice',name:'Alice',full:'Alice',emoji:'👧',veh:'Rolling Teapot',body:'#35b6e8',trim:'#fff',shape:'round',spd:3,acc:4,hnd:5,wt:2,quip:"Curiouser and curiouser, and a good deal faster than expected."}

const ITEMS={
 apple:{icon:'🍎',name:'Poison Apple',w:[3,3,3,2,2,1]},
 chicken:{icon:'🐔',name:'Rubber Chicken',w:[3,3,3,3,2,2]},
 crumb:{icon:'🍞',name:'Breadcrumb Boost',w:[2,2,3,3,4,4]},
 slipper:{icon:'👠',name:'Glass Slipper',w:[0,1,2,3,3,3]},
 mirror:{icon:'🪞',name:'Magic Mirror',w:[2,2,1,1,1,1]},
 sprout:{icon:'🌱',name:'Beanstalk Sprout',w:[0,1,2,3,4,5]}
};
function rollItem(rank){
 let tot=0;const ks=Object.keys(ITEMS);
 ks.forEach(k=>tot+=ITEMS[k].w[Math.min(rank,5)]);
 let r=Math.random()*tot;
 for(const k of ks){r-=ITEMS[k].w[Math.min(rank,5)];if(r<=0)return k;}
 return'crumb';
}

/* ============ expanded Cheshire Cat commentary ============ */
function addCH(k,a){CH[k]=(CH[k]||[]).concat(a);}
addCH('go',["And they're off! Please keep all limbs, paws and wings inside the kart.","Green light! Or whatever colour magic is. Go!","Off they go, like a rumour through a village.","The race is on! Do try to be the one in front. It has the nicest view."]);
addCH('lead',["{p} is in front now. Enjoy it. Fairytale leads rarely last.","{p} has taken first. The rest of you may now admire the exhaust.","There goes {p}, leading the pack like a piper with a turbo.","First place belongs to {p}. For the moment. Everything belongs to someone for the moment.","{p} is ahead! I'd clap, but paws."]);
addCH('loseLead',["And the lead is gone. Poof. Like a pumpkin at midnight.","Somebody has stolen first place. Naughty, naughty.","You were winning. Do you remember? It was lovely.","First place has wandered off. Go and fetch it."]);
addCH('pass',["Past {b}! Wonderfully rude. I approve entirely.","{b} has been left in your dust. Do wave.","You've overtaken {b}. They look dreadfully upset. Lovely.","Another one bites the dust. Sorry, {b}. Not sorry.","{b} is now behind you. A new and flattering perspective.","By {b} you go! Smooth as custard."]);
addCH('passed',["{b} slides past. You let them, I'm sure. Strategy.","And {b} is ahead. Oh well. Overtaking is only a hobby.","There goes {b}. Do say goodbye.","{b} has taken your place. I'm sure they'll give it back. They won't.","You've been overtaken by {b}. It happens to the best of us. And to you.","{b} zips by. Rude, but effective."]);
addCH('hitApple',["Apple! Never trust fruit that looks that shiny.","You've been poisoned. Sleep tight, buttercup.","One bite and you're done. Snow White sends her regards.","Splat! The apple wins. Again."]);
addCH('hitChicken',["Bwaaak! A chicken. In your face. At speed.","Struck by poultry. A noble way to go.","That chicken had a plan, and the plan was you.","Rubber chicken! The great equaliser."]);
addCH('hitSlipper',["The slipper fits! Cinderella was not exaggerating.","A glass slipper, straight to the bumper. How elegant.","Homing slipper! It always finds its sole."]);
addCH('hitThorn',["Ouch! Thorns! They are not a metaphor.","A thorn bush! The most prickly sort of obstacle.","Pricked! A hundred years of sleep, or just a spin. Lucky you.","The roses bite back."]);
addCH('youHit',["{b} is spinning like a very confused teapot. Lovely work.","That's what we call a hit. And a miss, for {b}.","Fantastic aim! {b} had it coming. Probably.","{b} has been duly dealt with. Next!","Oh that was lovely. {b} is going round in circles. Like the plot of this race."]);
addCH('shield',["The mirror has spoken: not today, nasty thing.","Reflected! Mirror, mirror, you were fair.","A shield of glass! Marvellous. Hold it up to the light."]);
addCH('aiHit',["{a} has lobbed something horrid at {b}. Delightful.","{b} is now spinning. {a} claims it was an accident. It wasn't.","Ouch! {b} just met {a}'s idea of a gift.","Oh, {b}. {a} sends their love, and a projectile.","{a} strikes {b}! The audience, a sleepy pumpkin, applauds.","Rivalry! {a} and {b} aren't speaking now. Mostly because {b} is dizzy."]);
addCH('offroad',["You're on the grass, dear. The grass is not a road. It tried to tell you.","Off-roading! How adventurous and how slow.","The scenery would like you to stop sampling it.","Grass is free. So is a trip back to the road.","That is not a road. That is a lawn."]);
addCH('bonk',["Bonk! You and the scenery are now acquainted.","That tree was there long before you, dear.","Oof. Right into the furniture of the world.","Crash! The scenery thanks you for the visit.","Your bumper and that thing are now best friends."]);
addCH('pad',["Zoom pad! Speed, glorious speed.","A boost! The road gives and the road takes. Mostly gives.","Whoosh! That's the sound of competence. Or luck.","Free speed, courtesy of the management.","Zing! Magenta and cyan, the colours of the fast."]);
addCH('drift',["Drifting beautifully. All sparks and no brakes.","That drift boost is a work of art.","Sideways and proud! Lovely.","Spark, spark, whoosh! Is there anything more satisfying? Don't answer.","You slide like butter on a hot cauldron."]);
addCH('lap2',["Lap two begins. The scenery is starting to recognise you.","Second lap! Everyone's still racing. How disappointing for the drama."]);
addCH('lap3',["The final lap! Everything counts now. Especially the apples.","One lap left. If you're going to be brave, be brave now.","Last lap! Remember: shortcuts are for the clever and the foolish. Mostly the foolish."]);
addCH('fin1',["A victory! You win, and the story gets its happy ending. Disgusting. I love it.","You've won! I'd say I always believed in you, but I didn't. It's lovely anyway.","First place! Happily ever after, delivered right on time."]);
addCH('fin2',["Second place. The runner-up. Still a crown, technically.","So close! Next time push a bit harder. Or throw a bit more fruit."]);
addCH('fin3',["Third place. A podium finish! The bronze looks good on you.","On the podium! The tiny, wobbly, bronze part of it."]);
addCH('finLow',["You finished. And that's what matters. Not really, but it's kind to say.","Well, you crossed the line. The line is grateful.","Not your day, but the story isn't over. It's barely begun.","Back of the pack! The scenery had a lovely view of you."]);
addCH('last',["You're last. Wonderful view of everyone's rear bumpers, I'm sure.","At the back! There's no pressure back here. Or progress.","Last place is where heroes are made. Or where they take a nap.","Someone has to be last. Today, it's you. Cheer up!","The back of the pack. It's quiet. It's lonely. It's perfect for reflection."]);
addCH('gust',["The Wolf is huffing again! Lean into it!","Here comes the wind! Hold on to your tiaras.","A gust from the side! Honestly, the Wolf has no manners."]);
addCH('midnight',["Midnight! Everything gets purple, and pointier.","The clock has struck twelve, and so, I'm afraid, has my mood.","It's dark now. Don't worry. The cat can see in the dark. You, less so."]);
addCH('idle',["I've been narrating for hours. Nobody's listened. Marvellous.","A race is just a very fast way of getting somewhere nobody asked you to go.","Do you ever wonder where the road goes? I don't. I know. It goes in circles.","They say all roads lead to Rome. This one leads to the start line.","If I had hands, I'd steer. As it is I have commentary.","The thing about karts is they have wheels. Do keep them on the ground.","I'm told there's a trophy. I'm told it's gold. I'm told a lot of things.","I could do this all day. I will, if you keep spinning out."]);

/* track flavour */
CH.idle_ginger=["Don't lick the road. It's tempting, but it's tarmac, not toffee. Mostly.","Those lollipops are twelve feet tall. The Candy King is a very ambitious man.","The houses are made of gingerbread, and the roofs are made of regret.","Somewhere in this village, a witch is having a very awkward day.","I'm told the gumdrops are delicious. I'm also told they are load-bearing.","Sugar everywhere. This is either paradise or a dentist's nightmare.","Don't tell the Gingerbread Man, but the oven is on in the next village."];
CH.idle_woods=["The trees are watching. They always are.","It's very dark in here. Naturally, that's what makes it so cosy.","Do stay on the path, dear. That's what paths are for.","I smell wolf. And a faint hint of tea. Odd.","Somewhere in these woods there's a lost girl in a red hood. Do be kind.","Mushrooms everywhere. Do not eat them. Do not ask why.","The straw house is just there. I wouldn't lean on it."];
CH.idle_wonder=["Why is a raven like a writing desk? Nobody knows. It's the question of the race.","The flamingos are mallets, the hedgehogs are balls, and the Queen is absolutely furious.","I'm late, I'm late! Actually no, I'm right on time.","The cards have been painting the roses red. Do not ask about the paint.","Up is down and down is up. Lovely. It's like a Tuesday.","The croquet hoops look suspiciously like portals. Do avoid them.","Everything here is perfectly normal. That is the problem."];
CH.idle_palace=["This palace has 365 rooms and exactly one working clock.","The pumpkins are decorative. For now.","Somebody here has lost a shoe. They'll be along shortly.","Chandeliers, ballrooms and a very strict dress code. For karts.","The clock watches the time. I watch you. Equally menacing.","Midnight approaches. I'd hurry. Or don't. I love drama.","All this gold, and not one of them can drive in a straight line."];
CH.idle_beanstalk=["We are very high up. Don't look down. Actually do, it's spectacular.","Somewhere above, a giant is thinking about lunch. You're the lunch, I'm afraid.","The beanstalk is growing as we speak. I wouldn't hang about.","Fee, fi, fo, fum! I do love a classic.","The golden goose is somewhere around here. It has a terrible attitude.","Jack was a thief, you know. A charming one. But a thief."];
CH.idle_swamp=["Do you hear the frogs? That's the sound of low expectations.","The witch's hut is around here somewhere. It walks. Don't ask.","The mud is thick, the fog is thicker, and the company is thickest of all.","I'd say it's a nice swamp, but I'm trying to be honest today.","Will-o'-the-wisps ahead. Ignore them. They lie. Mostly.","That bubbling noise is either the swamp or someone's lunch."];
CH.idle_glacier=["It's cold. I'd shiver, but I'm too dignified. Actually no, I'm shivering.","The Snow Queen's mirror is somewhere here. If it breaks, do not pick up the pieces.","Ice is just water having an identity crisis. So is this race.","Mind the slide. The ice has opinions and none of them are yours.","The aurora tonight is lovely. Sadly you are looking at the road. Good.","Everything here is either frozen or about to be."];
CH.idle_thorn=["A hundred years asleep, and the roses grew rather ambitious.","The thorns are very, very sharp. Mind your bumpers.","Somewhere up there a princess is napping. Do keep it down. Don't.","The roses are blooming, and not for you.","Briar and bramble and a great deal of pointiness.","Prick your finger and you sleep for a century. Prick your kart and it's only a spin."];
CH.mud=["Mud! The road has turned into pudding.","Splish, splash! The swamp is not a friend.","Slow going in the muck. Try a boost.","The mud is slowing you. Do something clever."];

CH.r_cinder=["Cinderella is close. Her carriage has fewer than twelve hours of warranty.","Cinderella's pumpkin is looking particularly shiny. And particularly fast.","Cinderella drifts like she's late for a ball. She probably is.","Careful, that's a princess. Princesses bite. Mostly in business."];
CH.r_wolf=["The Wolf is nearby. Do keep your windows up and your tyres inflated.","The Big Bad Wolf is breathing down your neck. That's literal, he has asthma.","That hot rod is making a lot of noise. The Wolf is mostly noise. Mostly.","Wolf at your door! And your bumper. And your wing mirror."];
CH.r_pigs=["The Three Pigs are near, in a truck made of bricks. Delightfully sturdy.","Don't bump the pigs. Bricks hurt. Also they bite.","A brick truck! The pigs have clearly learned something from the Wolf.","The pigs are close. Do not huff, and do not puff."];

/* mud patches and permanent thorns, run after buildTrack */
function addExtras(T){
 const N=segs.length,R=rng(T.seed+7);
 if(T.mud){
  T.mud.forEach((f,i)=>{
   const st=Math.floor(N*f),len=40+((R()*14)|0),cx=[-.5,0,.5,-.3,.3][(R()*5)|0];
   for(let k=0;k<len;k++){const s=segs[(st+k)%N];if(!s.pad)s.mud={x:cx,w:.5};}
  });
 }
 if(T.thorns){
  for(let i=0;i<T.thorns;i++){
   const idx=Math.floor(N*((i+.5)/T.thorns))+((R()*8)|0);
   if(idx<30||idx>N-30)continue;
   const cx=[-.6,-.3,0,.3,.6][(R()*5)|0];
   G.hazards.push({dist:(idx+.5)*SEG,x:cx,owner:null,life:1e9,arm:0,perm:true,ch:T.hzch||'🌵',kind:T.hzk||'thorn'});
   if(R()<.4)G.hazards.push({dist:(idx+3.5)*SEG,x:clamp(cx+(R()<.5?-.55:.55),-.8,.8),owner:null,life:1e9,arm:0,perm:true,ch:T.hzch||'🌵',kind:T.hzk||'thorn'});
  }
 }
}

/* backgrounds for new tracks */
function bg2Sun(T,sx){
 if(T.bg!=='sky'&&T.bg!=='swamp'&&T.bg!=='ice'&&T.bg!=='thorn'){bg3Sun(T,sx);return;}
 if(T.bg==='sky'){ctx.fillStyle='#fff7a8';ctx.beginPath();ctx.arc(sx,HY*.45,H*.08,0,6.2832);ctx.fill();}
 else if(T.bg==='swamp'){ctx.globalAlpha=.7;ctx.fillStyle='#e5f2b8';ctx.beginPath();ctx.arc(sx,HY*.42,H*.05,0,6.2832);ctx.fill();ctx.globalAlpha=1;}
 else if(T.bg==='ice'){
  const t=G.clock;
  [['rgba(80,255,180,.28)',.0],['rgba(60,200,255,.24)',1.7],['rgba(255,80,220,.18)',3.2]].forEach((b,i)=>{
   ctx.fillStyle=b[0];ctx.beginPath();ctx.moveTo(0,HY*.55);
   for(let x=0;x<=W;x+=W/24)ctx.lineTo(x,HY*(.2+.07*i)+Math.sin(x*.012+t*.5+b[1]+i)*HY*.06);
   for(let x=W;x>=0;x-=W/24)ctx.lineTo(x,HY*(.42+.07*i)+Math.sin(x*.01+t*.4+b[1])*HY*.05);
   ctx.closePath();ctx.fill();});
 }else if(T.bg==='thorn'){ctx.fillStyle='#ffd0e8';ctx.beginPath();ctx.arc(sx,HY*.4,H*.09,0,6.2832);ctx.fill();ctx.fillStyle='rgba(255,134,173,.5)';ctx.beginPath();ctx.arc(sx+H*.02,HY*.4,H*.085,0,6.2832);ctx.fill();}
}
function bg2Layers(T,off,pal){
 if(T.bg!=='sky'&&T.bg!=='swamp'&&T.bg!=='ice'&&T.bg!=='thorn'){bg3Layers(T,off,pal);return;}
 if(T.bg==='sky'){
  silhouette(pal.far,H*.08,H*.02,.007,off*.1);
  ctx.fillStyle='rgba(255,255,255,.92)';
  for(let i=0;i<9;i++){const cx=((i*W*.31-off*(.06+(i%3)*.03))%(W*1.6)+W*1.6)%(W*1.6)-W*.3,cy=HY*(.15+(i%4)*.17),r=H*(.03+(i%3)*.012);
   ctx.beginPath();ctx.arc(cx,cy,r,0,6.2832);ctx.arc(cx+r*1.1,cy+r*.1,r*.8,0,6.2832);ctx.arc(cx-r*1.0,cy+r*.15,r*.7,0,6.2832);ctx.fill();}
  silhouette(pal.hill1,H*.07,0,.011,off*.25);
 }else if(T.bg==='swamp'){silhouette(pal.far,H*.1,H*.01,.009,off*.12,'saw');silhouette(pal.hill1,H*.1,0,.014,off*.28,'saw');}
 else if(T.bg==='ice'){silhouette(pal.far,H*.16,H*.01,.007,off*.1,'saw');silhouette(pal.hill1,H*.12,0,.012,off*.25,'saw');}
 else if(T.bg==='thorn'){castle(pal.far,off*.12);silhouette(pal.hill1,H*.12,0,.014,off*.3,'saw');}
}

/* falling weather: screen-space, no allocation */
function drawFx(){
 const fx=G.track&&G.track.fx;if(!fx||G.state==='menu')return;
 const t=G.clock,n=fx==='snow'?70:fx==='petal'?36:30;
 if(fx==='confetti'){for(let i=0;i<40;i++){ctx.fillStyle=['#ff2f4f','#19e6ff','#ffd23f','#ff2fd0','#7aff4a'][i%5];const x=((i*97.3+Math.sin(t*.9+i)*30)%W+W)%W,y=((i*61.7+t*(50+(i%4)*14))%H+H)%H;ctx.fillRect(x,y,4,6);}return;}
 ctx.fillStyle=fx==='snow'?'#fff':fx==='petal'?'#ff9fc4':fx==='ember'?'#ff9a2a':'#c8ff8a';

/* procedural music */
const MU={gain:null,next:0,step:0,key:'',scale:[0,2,4,7,9],root:57,bpm:120,mi:3};
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function mnote(t,f,type,d,v,lp){
 try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let out=g;o.connect(g);
  if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;g.connect(fl);out=fl;}
  out.connect(MU.gain);o.start(t);o.stop(t+d+.05);}catch(e){}
}
function musicTick(want){
 if(!AC)return;
 if(!MU.gain){MU.gain=AC.createGain();MU.gain.gain.value=0;MU.gain.connect(AC.destination);}
 const t=AC.currentTime;
 MU.gain.gain.setTargetAtTime(want&&G.musicOn?.55:0,t,.25);
 if(!want||!G.musicOn||!G.track)return;
 if(MU.key!==G.track.id){
  MU.key=G.track.id;const i=G.trackIdx;
  MU.scale=i<4?[0,2,4,7,9]:i<8?[0,3,5,7,10]:[0,2,3,7,9];
  MU.root=50+((i*5)%9);MU.bpm=112+((i*7)%22);MU.step=0;MU.next=t+.1;
 }
 if(MU.next<t-.5)MU.next=t+.05;
 while(MU.next<t+.3){
  const s=MU.step%16,bar=Math.floor(MU.step/16),deg=[0,2,3,1][bar%4],sc=MU.scale;
  if(s%4===0)mnote(MU.next,mtof(MU.root-12+sc[deg%5]),'triangle',.38,.2,500);
  if(s%2===0&&Math.random()<.85){
   MU.mi=clamp(MU.mi+[-1,0,1,1,-2,2][(Math.random()*6)|0],0,9);
   mnote(MU.next,mtof(MU.root+12+sc[MU.mi%5]+12*Math.floor(MU.mi/5)),'square',.16,.07,1800);
  }
  if(s===8||s===14)mnote(MU.next,mtof(MU.root+sc[(deg+2)%5]),'triangle',.22,.1,900);
  MU.next+=60/MU.bpm/2;MU.step++;
 }
}

async function zip(str,dec){
 const cs=dec?new DecompressionStream('deflate-raw'):new CompressionStream('deflate-raw');
 const w=cs.writable.getWriter();w.write(dec?str:new TextEncoder().encode(str));w.close();
 const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());
 return dec?new TextDecoder().decode(buf):buf;
}
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

async function decodeGhost(code){

 const o=JSON.parse(json);
 const ti=TRACKS.findIndex(t=>t.id===o.t);
 if(o.v!==1||ti<0||!Array.isArray(o.d)||o.d.length<40||o.d.length>8000||o.d.length%2)throw new Error('This ghost code is damaged.');
 if(!(o.time>10&&o.time<900))throw new Error('This ghost has an odd time.');

}

const cv=$('c'),ctx=cv.getContext('2d');

function project(p,camX,camY,camZ){
 p.camera.x=(p.world.x||0)-camX;p.camera.y=p.world.y-camY;p.camera.z=p.world.z-camZ;
 const sc=CAMD/p.camera.z;p.screen.scale=sc;

/* ============ track building ============ */
let segs=[],TL=0;
function segAt(z){return segs[Math.floor((((z%TL)+TL)%TL)/SEG)%segs.length];}
function dm(a,b){const d=(a-b)%TL;return((d+TL*1.5)%TL)-TL/2;} /* signed shortest distance a-b */
function buildTrack(T){
 segs=[];
 const lastY=()=>segs.length?segs[segs.length-1].p2.world.y:0;
 const add=(curve,y)=>{const n=segs.length;segs.push({index:n,p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},p2:{world:{y:y,z:(n+1)*SEG},camera:{},screen:{}},curve:curve,sprites:[],dark:Math.floor(n/RUMBLE)%2,pad:null,looped:false,clip:0});};
 const road=(e,h,l,c,y)=>{const sy=lastY(),ey=sy+y*SEG,tot=e+h+l;
  for(let n=0;n<e;n++)add(easeIn(0,c,n/e),easeInOut(sy,ey,n/tot));
  for(let n=0;n<h;n++)add(c,easeInOut(sy,ey,(e+n)/tot));
  for(let n=0;n<l;n++)add(easeInOut(c,0,n/l),easeInOut(sy,ey,(e+h+n)/tot));};
 T.cmds.forEach(c=>road(c[0],c[1],c[2],mirrorOn()?-c[3]:c[3],c[4]));
 road(20,20,20,0,-lastY()/SEG); /* return to ground level */
 road(10,10,10,0,0);            /* short straight into the start line */
 TL=segs.length*SEG;
 const R=rng(T.seed),N=segs.length;
 /* scenery */
 for(let n=6;n<N;n+=2){
  if(R()>T.dens)continue;
  const side=R()<.5?-1:1,off=side*(1.3+R()*R()*2.2),kind=T.scn[(R()*T.scn.length)|0];
  const big=(kind==='ferris'||kind==='pirate'||kind==='minaret'||kind==='cave'||kind==='timber'||kind==='volcano'||kind==='hut'||kind==='tower'||kind==='igloo'||kind==='house'||kind==='clock'||kind==='pillar'||kind==='bmush'||kind==='strawhouse');
  segs[n].sprites.push({k:kind,off:off,ws:big?1.25:1,v:(R()*3)|0,hw:big?.32:.2});
  if(R()<.5){const o2=-side*(1.3+R()*2),k2=T.scn[(R()*T.scn.length)|0];segs[(n+1)%N].sprites.push({k:k2,off:o2,ws:1,v:(R()*3)|0,hw:.2});}
 }
 /* boost pads: 3 per straight-ish place */
 const pads=T.pads||7;
 for(let i=1;i<=pads;i++){
  let idx=Math.floor(N*(i/(pads+1)))+((R()*10)|0);
  for(let tries=0;tries<30&&Math.abs(segs[idx%N].curve)>1.2;tries++)idx++;
  const cx=[-.5,0,.5][(R()*3)|0];
  for(let k=0;k<4;k++)segs[(idx+k)%N].pad={x:cx,w:.4};
 }
 /* item boxes: rows of three, between pads */
 G.boxes=[];
 const rows=7;
 for(let i=0;i<rows;i++){
  let idx=Math.floor(N*((i+.5)/rows));
  for(let tries=0;tries<30&&Math.abs(segs[idx%N].curve)>1.5;tries++)idx++;
  [-.55,0,.55].forEach(x=>G.boxes.push({dist:(idx+.5)*SEG,x:x,t:0}));
 }
}

function silhouette(color,amp,base,freq,off,mode){

 const step=Math.max(5,W/90);
 for(let x=0;x<=W+step;x+=step){
  const u=(x+off)*freq;let h;

}
function castle(color,off){

function render(){
 if(!G.track)return;
 const T=G.track,pal=mixPal(T),cam=G.cam;
 drawBackground(T,pal);
 const camDist=cam.dist;
 const pos=(((camDist-PLAYERZ)%TL)+TL)%TL;
 const base=segAt(pos),basePct=(pos%SEG)/SEG;

 const playerY=lerp(ps.p1.world.y,ps.p2.world.y,pp);
 const camY=playerY+CAMH+(cam.airH||0)*.35;
 const camX=cam.x*ROAD;
 let maxy=H,x=0,dx=-(base.curve*basePct);
 const n0=base.index,L=segs.length;
 for(let n=0;n<DRAWN;n++){
  const seg=segs[(n0+n)%L];seg.looped=seg.index<n0;
  const cz=pos-(seg.looped?TL:0);
  project(seg.p1,camX-x,camY,cz);project(seg.p2,camX-x-dx,camY,cz);
  x+=dx;dx+=seg.curve;seg.clip=maxy;
  if(seg.p1.camera.z<=CAMD||seg.p2.screen.y>=seg.p1.screen.y||seg.p2.screen.y>=maxy)continue;
  drawSegment(seg,pal,n);maxy=seg.p1.screen.y;
 }
 /* bucket moving objects by segment */
 const map={};
 const put=(o)=>{const i=segAt(o.dist).index;(map[i]||(map[i]=[])).push(o);};
 for(const r of G.racers)if(r!==cam)put({t:'r',dist:r.dist,r:r,off:r.x});
 for(const h of G.hazards)put({t:'h',dist:h.dist,h:h,off:h.x});
 for(const p of G.projs)put({t:'p',dist:p.dist,p:p,off:p.x});
 for(const b of G.boxes)if(b.t<=0)put({t:'b',dist:b.dist,b:b,off:b.x});
 {const cl=Math.floor(Math.max(0,cam.dist)/TL);for(const c of G.coins)if(c.lap!==cl)put({t:'c',dist:c.dist,off:c.x});}
 {const gp=ghostPos();if(gp)put({t:'g',dist:gp.dist,off:gp.x});const rp=ghostPos(G.rival);if(rp)put({t:'g',dist:rp.dist,off:rp.x,g:G.rival});}
 for(let n=DRAWN-1;n>0;n--){
  const seg=segs[(n0+n)%L];
  if(seg.p1.camera.z<=CAMD)continue;

  for(const s of seg.sprites){
   const sx=seg.p1.screen.x+sc*s.off*ROAD*KX,sy=seg.p1.screen.y,w=sc*900*KX*s.ws;
   if(w<2||sx<-w*2||sx>W+w*2)continue;
   if(cl<sy){ctx.save();ctx.beginPath();ctx.rect(0,0,W,Math.max(0,cl));ctx.clip();sprite(s.k,sx,sy,w,s.v);ctx.restore();}
   else sprite(s.k,sx,sy,w,s.v);
  }
  const lst=map[seg.index];
  if(lst)for(const o of lst){
   const pc=(((o.dist%SEG)+SEG)%SEG)/SEG;
   const osc=lerp(seg.p1.screen.scale,seg.p2.screen.scale,pc);
   const sx=lerp(seg.p1.screen.x,seg.p2.screen.x,pc)+osc*o.off*ROAD*KX;
   const sy=lerp(seg.p1.screen.y,seg.p2.screen.y,pc);
   const w=osc*CARW*ROAD*KX;
   if(w<2)continue;
   const clipped=cl<sy;
   if(clipped){ctx.save();ctx.beginPath();ctx.rect(0,0,W,Math.max(0,cl));ctx.clip();}
   if(o.t==='r'){const r=o.r;drawKart(sx,sy,w,r,{lift:r.airH*w*.9,spin:r.spin>0?r.spinA:0,boost:r.boost>0,tilt:r.steerV});}
   else if(o.t==='b')drawBox(sx,sy,w,o.b.dist);
   else if(o.t==='c')drawEmojiObj(sx,sy,w*.8,'🪙',w*.3+Math.sin(G.clock*5+o.dist)*w*.04);
   else if(o.t==='g')drawGhost(sx,sy,w,o.g);
   else if(o.t==='h')drawEmojiObj(sx,sy,w*1.1,o.h.ch||'🍎');
   else if(o.t==='p')drawEmojiObj(sx,sy,w*1.1,o.p.kind==='chicken'?'🐔':'👠',w*.35);
   if(clipped)ctx.restore();
  }
 }
 // Clear view: no screen-space fog over the road or scenery.

 for(let i=pool.length-1;i>0;i--){const j=Math.floor(rf()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t;}
 return pool.slice(0,5);
}

/* ============ helpers for effects ============ */
function ev(type,a,b,c){G.evq.push({type:type,a:a,b:b,c:c});}
function startAir(r,dur){r.air=dur;r.airDur=dur;if(r.isPlayer&&dur>.6)ev('air');}
function endDrift(r){
 if(!r.driftDir)return;
 if(r.charge>=1.5){r.boost=Math.max(r.boost,1.4);if(r.isPlayer){ev('driftBoost',2);sfx('boost');}}
 else if(r.charge>=.7){r.boost=Math.max(r.boost,.8);if(r.isPlayer){ev('driftBoost',1);sfx('boost');}}
 r.driftDir=0;r.charge=0;
}
function hitRacer(r,src,kind){
 if(r.inv>0||r.airH>.05||r.finished&&r.isPlayer&&false)return false;
 if(r.shield>0){r.shield=0;r.inv=.7;ev('shield',r,src);return false;}
 r.spin=r.data.id==='pigs'?.85:1.25;r.spinA=0;r.speed*=.25;r.boost=0;r.inv=2.3;r.driftDir=0;r.charge=0;
 ev('hit',r,src,kind);return true;
}
function useItem(r){
 if(!r.item||r.roll>0||r.spin>0)return;
 const k=r.item;r.item=null;if(r.isPlayer)ev('use',k);
 if(k==='apple')G.hazards.push({dist:r.dist-800,x:r.x,owner:r,life:35,arm:.25});
 else if(k==='crumb'){r.boost=Math.max(r.boost,1.7);if(r.isPlayer)sfx('boost');}
 else if(k==='sprout'){startAir(r,1.2);r.boost=Math.max(r.boost,1.6);r.inv=Math.max(r.inv,1.25);if(r.isPlayer)sfx('boost');}
 else if(k==='mirror'){r.shield=10;if(r.isPlayer)sfx('pick');}
 else if(k==='chicken'){G.projs.push({kind:'chicken',dist:r.dist+700,x:r.x,speed:MAXS*1.7,owner:r,life:3,age:0,tgt:null});if(r.isPlayer)sfx('throw');}
 else if(k==='slipper'){
  let tgt=null,best=1e9;
  for(const o of G.racers){if(o===r||o.finished)continue;const d=dm(o.dist,r.dist);if(d>0&&d<best){best=d;tgt=o;}}
  G.projs.push({kind:'slipper',dist:r.dist+700,x:r.x,speed:MAXS*1.5,owner:r,life:6,age:0,tgt:tgt});if(r.isPlayer)sfx('throw');
 }
}
function spawnPart(x,y,vx,vy,c,s){if(G.parts.length<160)G.parts.push({x:x,y:y,vx:vx,vy:vy,c:c,s:s,l:.5});}

/* ============ AI ============ */
function aiSteer(r,dt,seg,pct){
 r.aiT-=dt;
 if(r.aiT<=0){
  r.aiT=.2+Math.random()*.2;
  let tx=r.lane+Math.sin(G.clock*.5+r.phase)*.22;
  if(!r.item&&r.roll<=0&&!r.finished){let bd=5200;for(const b of G.boxes){if(b.t>0)continue;const d=dm(b.dist,r.dist);if(d>200&&d<bd&&Math.abs(b.x-r.x)<1.1){bd=d;tx=b.x;}}}
  for(const o of G.racers){if(o===r)continue;const d=dm(o.dist,r.dist);if(d>0&&d<1700&&Math.abs(o.x-tx)<.36)tx=o.x+(tx>=o.x?.46:-.46);}
  for(const h of G.hazards){const d=dm(h.dist,r.dist);if(d>0&&d<(h.perm?6000:2000)&&Math.abs(h.x-tx)<.36)tx=h.x+(tx>=h.x?.46:-.46);}
  r.tx=clamp(tx,-.88,.88);
 }
 const old=r.x;
 r.x+=clamp((r.tx-r.x)*2.4,-1.1,1.1)*dt*(.4+pct);
 r.steerV=lerp(r.steerV,clamp((r.x-old)/(dt+1e-4)*.8,-1,1),Math.min(1,dt*6));
}
function aiItems(r,dt){
 if(!r.item||r.roll>0||r.spin>0){r.hold=0;return;}
 r.hold+=dt;r.aiItemT-=dt;
 if(r.aiItemT>0&&r.hold<12)return;
 let use=false;const k=r.item;
 if(k==='crumb'||k==='sprout')use=true;
 else if(k==='mirror')use=r.hold>3;
 else for(const o of G.racers){if(o===r)continue;const d=dm(o.dist,r.dist);
  if(k==='apple'&&d<0&&d>-3500)use=true;
  if(k==='chicken'&&d>0&&d<4500&&Math.abs(o.x-r.x)<.6)use=true;
  if(k==='slipper'&&d>0&&d<9000)use=true;}
 if(r.hold>=12)use=true;
 if(use){useItem(r);r.hold=0;r.aiItemT=(1.5+Math.random()*3)*[2,1.4,1][G.diff];}else r.aiItemT=.6;
}

/* ============ per-racer update ============ */
function updateRacer(r,dt){
 const seg=segAt(r.dist),T=G.track;
 r.boost=Math.max(0,r.boost-dt);r.inv=Math.max(0,r.inv-dt);r.bonk=Math.max(0,r.bonk-dt);if(r.shield>0)r.shield-=dt;
 if(r.air>0){r.air=Math.max(0,r.air-dt);r.airH=r.air>0?Math.sin(Math.PI*clamp(1-r.air/r.airDur,0,1)):0;}else r.airH=0;
 if(r.roll>0){r.roll-=dt;if(r.roll<=0){r.item=rollItem(r.rank-1);if(r.isPlayer){sfx('pick');ev('got',r.item);}}}
 if(G.state==='grid'){r.speed=0;return;}
 const pct=r.speed/MAXS;
 const auto=r.auto;
 let cap=MAXS*r.top*(r.boost>0?1.42:1);
 if(auto){
  let rub=1;if(G.player&&!G.player.auto){rub=1+clamp((G.player.dist-r.dist)/(TL*.1),-1,1)*(G.player.dist>r.dist?RUBA[G.diff]:RUBB[G.diff]);}
  cap*=(r.boost>0?1:r.skill*rub)*(1-Math.min(.05,Math.abs(seg.curve)*.006));
  if(r.finished&&r.isPlayer)cap=MAXS*r.top*.9;
 }
 if(seg.mud&&r.airH<.3&&Math.abs(r.x-seg.mud.x)<seg.mud.w+.08){cap*=r.boost>0?.78:.5;if(!r.inMud&&r.isPlayer)ev('mud');r.inMud=true;}else r.inMud=false;
 if(Math.abs(r.x)>1.05&&r.airH<.2){cap=Math.min(cap,OFFLIM*1.5);r.off=true;}else r.off=false;
 /* speed */
 if(r.spin>0){r.spin-=dt;r.spinA+=dt*15;r.speed=Math.max(MAXS*.1,r.speed-MAXS*.55*dt);}
 else{
  const acc=MAXS/4.2*r.accM*(r.boost>0?3.4:1);
  if(r.speed<cap)r.speed=Math.min(cap,r.speed+acc*dt);else r.speed=Math.max(cap,r.speed-MAXS*(r.off?.8:.6)*dt);
 }
 /* steering */
 if(auto){aiSteer(r,dt,seg,pct);aiItems(r,dt);}
 else{
  const st=ctl.steer,ast=Math.abs(st),sg=Math.sign(st);
  if(!r.driftDir&&r.spin<=0&&r.airH<.1&&pct>.45){
   if(ctl.d&&ast>.25){r.driftDir=sg;r.charge=0;}
   else if(G.autoDrift&&ast>.8&&Math.abs(seg.curve)>=2&&Math.sign(seg.curve)===sg){r.adT=(r.adT||0)+dt;if(r.adT>.25){r.driftDir=sg;r.charge=0;r.adT=0;}}
   else r.adT=0;
  }
  const holding=ctl.d||(G.autoDrift&&ast>.35&&sg===r.driftDir);
  if(r.driftDir&&(!holding||pct<.35||r.spin>0))endDrift(r);
  let steer=st,cf=.2*(G.assist?.4:1);
  if(r.driftDir){steer=clamp(r.driftDir*.7+st*.55,-1.15,1.15);cf=.07;r.charge+=dt*(sg===r.driftDir?1.25:ast<.15?1:.7);}
  if(T.ice){r.iceS=lerp(r.iceS||0,steer,Math.min(1,dt*3));steer=r.iceS;cf*=1.3;}
  const dxs=dt*2*pct;
  if(r.spin<=0){r.x+=dxs*steer*1.35*r.hndM;r.x-=dxs*pct*seg.curve*cf;}
  r.steerV=lerp(r.steerV,r.spin>0?0:steer,Math.min(1,dt*9));
  r.x=clamp(r.x,-2.5,2.5);
  if(G.assist&&Math.abs(r.x)>1.02&&r.spin<=0)r.x-=Math.sign(r.x)*(Math.abs(r.x)-1.02)*dt*1.6;
  /* roadside scenery bonk */
  if(Math.abs(r.x)>1&&r.bonk<=0&&r.airH<.1){
   for(let k=0;k<2;k++){const s2=segs[(seg.index+k)%segs.length];
    for(const s of s2.sprites)if(Math.abs(r.x-s.off)<s.hw+.1){r.speed*=.35;r.bonk=.7;r.driftDir=0;r.charge=0;ev('bonk');k=2;break;}}
  }
 }
 /* wind */
 if(G.wind.t>0)r.x+=G.wind.dir*.7*dt*(.4+pct)*(r.wt>3?.7:1);
 if(auto)r.x=clamp(r.x,-1.15,1.15);
 /* move */
 r.dist+=r.speed*dt;
 /* pads */
 const s2=segAt(r.dist);
 if(s2.pad&&r.lastPad!==s2.index&&Math.abs(r.x-s2.pad.x)<s2.pad.w+.12&&r.airH<.5){
  r.lastPad=s2.index;if(r.boost<1)r.boost=1;
  if(T.padAir&&r.air<=0)startAir(r,.75);
  if(r.isPlayer){ev('pad');sfx('boost');}
 }
 if(r.isPlayer)collectCoins(r);
 /* item boxes */
 if(!r.item&&r.roll<=0&&!r.finished){
  for(const b of G.boxes){if(b.t>0)continue;
   if(Math.abs(dm(b.dist,r.dist))<380&&Math.abs(b.x-r.x)<.36){b.t=5;r.roll=.9;if(r.isPlayer)sfx('box');break;}}
 }
}

/* ============ world update ============ */
function update(dt){
 G.clock+=dt;
 const T=G.track;if(!T)return;
 if(G.state==='grid'){
  G.countdown-=dt;
  if(G.countdown<=0){
   G.count--;G.countdown=1;
   if(G.count>0){ev('count',G.count);}
   else{G.state='race';G.t=0;ev('go');}
  }
 }
 if(G.state==='race'||G.state==='demo'||G.state==='finish'||G.state==='grid'){
  const racing=G.state!=='grid';
  if(racing)G.t+=dt;
  if(ctl.itemPress){ctl.itemPress=false;if(G.player&&!G.player.auto)useItem(G.player);}
  inputStep(dt);
  ghostRecord(dt);
  for(const r of G.racers)updateRacer(r,dt);
  if(racing){
   /* bumps */
   const R=G.racers;
   for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){
    const a=R[i],b=R[j],d=dm(b.dist,a.dist);
    if(Math.abs(d)<CARLEN&&Math.abs(a.x-b.x)<.27&&a.airH<.1&&b.airH<.1&&a.spin<=0&&b.spin<=0){
     const dir=a.x<b.x?-1:1,ma=b.wt/(a.wt+b.wt),mb=a.wt/(a.wt+b.wt);
     a.x+=dir*dt*4*ma;b.x-=dir*dt*4*mb;
     const front=d>0?b:a,rear=d>0?a:b;
     if(rear.speed>front.speed)rear.speed=lerp(rear.speed,front.speed*.95,Math.min(1,dt*8));
     if((a.isPlayer||b.isPlayer)&&Math.random()<.1)sfx('bump');
    }
   }
   /* projectiles */
   for(const p of G.projs){
    p.age+=dt;p.life-=dt;
    if(p.kind==='slipper'&&p.tgt){p.speed=Math.max(MAXS*1.15,p.tgt.speed+MAXS*.5);p.x+=clamp((p.tgt.x-p.x)*3.2,-1.5,1.5)*dt;}
    else if(p.kind==='chicken'){p.x=clamp(p.x+Math.sin(p.age*9)*.4*dt,-1.2,1.2);}
    p.dist+=p.speed*dt;
    for(const r of R){if(r===p.owner&&p.age<.8)continue;if(r.finished&&!r.isPlayer)continue;
     if(Math.abs(dm(r.dist,p.dist))<420&&Math.abs(r.x-p.x)<.3){hitRacer(r,p.owner,p.kind);p.life=0;break;}}
   }
   G.projs=G.projs.filter(p=>p.life>0);
   /* hazards */
   for(const h of G.hazards){
    h.life-=dt;h.arm-=dt;
    for(const r of R){if(r===h.owner&&h.arm>0)continue;
     if(Math.abs(dm(r.dist,h.dist))<320&&Math.abs(r.x-h.x)<.28){hitRacer(r,h.owner,h.perm?(h.kind||'thorn'):'apple');if(!h.perm)h.life=0;break;}}
   }
   G.hazards=G.hazards.filter(h=>h.life>0);
   for(const b of G.boxes)if(b.t>0)b.t-=dt;
   /* ranks */
   const prog=r=>r.finished?LAPS*TL*10-r.finT:r.dist;
   const sorted=R.slice().sort((a,b)=>prog(b)-prog(a));
   sorted.forEach((r,i)=>{r.prevRank=r.rank;r.rank=i+1;});
   /* laps / finish */
   if(G.state!=='demo'){
    for(const r of R){
     if(!r.finished&&r.dist>=LAPS*TL){
      r.finished=true;r.finT=G.t;r.finRank=++G.finCount;r.auto=true;r.driftDir=0;
      if(r.isPlayer){G.state='finish';G.endT=0;ev('finish',r);}
     }
    }
    const lead=sorted[0];
    const lapOf=r=>clamp(Math.floor(r.dist/TL)+1,1,LAPS);
    if(T.night&&!G.nightGo&&lapOf(lead)>=2){G.nightGo=true;ev('midnight');}
    const pl=G.player;
    if(pl&&!pl.finished){const lp=lapOf(pl);if(lp>G.lapShown){G.lapShown=lp;G.lapTimes.push(G.t);ev('lap',lp);}}
    if(G.state==='finish'){
     G.endT+=dt;
     if(G.finCount>=R.length||G.endT>5)finishRace();
    }
   }
   if(G.nightGo)G.night=Math.min(1,G.night+dt*.45);
   /* wind */
   if(T.wind&&G.state!=='demo'){
    if(G.wind.warn>0){G.wind.warn-=dt;if(G.wind.warn<=0)G.wind.t=3.2;}
    else if(G.wind.t>0)G.wind.t-=dt;
    else{G.wind.next-=dt;if(G.wind.next<=0){G.wind.warn=1.6;G.wind.dir=Math.random()<.5?-1:1;G.wind.next=14+Math.random()*10;ev('gust');}}
   }
   /* background scroll */
   const cs=segAt(G.cam.dist);
   G.bgOff+=cs.curve*(G.cam.speed/MAXS)*dt*W*.5;
  }
 }
 /* particles (player kart screen space) */
 const pl=G.player;
 if(pl&&G.state!=='grid'&&G.state!=='menu'){
  const pw=(CAMD/PLAYERZ)*CARW*ROAD*KX,py=HY+KY*(CAMD/PLAYERZ)*CAMH;
  if(pl.driftDir&&pl.speed>MAXS*.3){
   const c=pl.charge>=1.5?'#ff2fd0':pl.charge>=.7?'#19e6ff':'#fff';
   for(let i=0;i<2;i++)spawnPart(W/2+(Math.random()<.5?-1:1)*pw*.4,py-4,(Math.random()-.5)*160,-80-Math.random()*120,c,Math.max(2,pw*.04));
  }
  if(pl.off&&pl.speed>MAXS*.15&&Math.random()<.6)spawnPart(W/2+(Math.random()-.5)*pw,py-4,(Math.random()-.5)*120,-60-Math.random()*80,'#8a6a3a',Math.max(2,pw*.05));
  if(pl.boost>0&&Math.random()<.5)spawnPart(W/2+(Math.random()-.5)*pw*.6,py-pw*.2,(Math.random()-.5)*60,60+Math.random()*80,Math.random()<.5?'#19e6ff':'#ff2fd0',Math.max(2,pw*.04));
 }
 for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt*2;}
 G.parts=G.parts.filter(p=>p.l>0);
}

function finishRace(){
 if(G.state==='results')return;
 const R=G.racers.slice();
 R.forEach(r=>{if(!r.finished){const left=LAPS*TL-r.dist;r.finT=G.t+left/(MAXS*.9);}});
 R.sort((a,b)=>{if(a.finished&&b.finished)return a.finRank-b.finRank;if(a.finished)return-1;if(b.finished)return 1;return b.dist-a.dist;});
 G.results=R.map((r,i)=>({r:r,pos:i+1,pts:POINTS[i],t:r.finT,est:!r.finished}));
 if(G.mode==='cup'){G.results.forEach(o=>{G.cup.totals[o.r.data.id]=(G.cup.totals[o.r.data.id]||0)+o.pts;});}
 const me=G.results.find(o=>o.r.isPlayer);
 if(me&&!me.est&&G.mode!=='daily'){const k=bestKey(G.track.id);const b=store(k);if(!b||me.t<b){G.newBest=!!b||true;G.prevBest=b;store(k,me.t);if(G.mode==='tt')store(ghostKey(G.track.id),{t:me.t,s:G.rec,r:G.sel,p:currentPaint()?currentPaint().id:'std'});}else G.prevBest=b;}
 G.lapTimes.push(me?me.t:0);
 G.earn=G.coinsGot*coinMul()+(G.mode==='tt'?5+(G.newBest&&G.prevBest?25:0):[30,20,12,8,5,5][(me?me.pos:6)-1]);
 store('coins',wallet()+G.earn);rivalNote(me);afterRace(me);
 G.state='results';
 onResults();
}

/* ============ audio ============ */
let AC=null,engO=null,engG=null,engF=null;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{
  AC=new(window.AudioContext||window.webkitAudioContext)();
  engO=AC.createOscillator();engO.type='sawtooth';engG=AC.createGain();engG.gain.value=0;engF=AC.createBiquadFilter();engF.type='lowpass';engF.frequency.value=420;
  engO.connect(engF);engF.connect(engG);engG.connect(AC.destination);engO.start();
 }catch(e){AC=null;}
}
function tone(f,d,type,v,f2){
 if(!AC||!G.sfxOn)return;
 try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}
}
function sfx(k){
 switch(k){
  case'box':tone(520,.12,'square',.05,880);break;
  case'pick':tone(660,.14,'triangle',.07,1320);break;
  case'coin':tone(1500,.07,'square',.04,2200);break;
  case'boost':tone(260,.4,'sawtooth',.05,900);break;
  case'throw':tone(520,.2,'square',.05,180);break;
  case'hit':tone(220,.45,'sawtooth',.08,50);break;
  case'bump':tone(130,.08,'square',.05);break;
  case'count':tone(440,.18,'square',.07);break;
  case'go':tone(880,.5,'square',.08);break;
  case'bell':tone(196,1.4,'sine',.12);tone(392,1.2,'sine',.05);break;
  case'win':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.08),i*130));break;
 }
}
function audioTick(){
 if(!AC||!engG)return;
 const on=G.sfxOn&&!G.paused&&G.player&&(G.state==='race'||G.state==='finish'||G.state==='grid');
 const t=AC.currentTime;
 if(on){const pct=G.player.speed/MAXS;engO.frequency.setTargetAtTime(55+pct*150+(G.player.boost>0?40:0),t,.05);engG.gain.setTargetAtTime(.022,t,.1);}
 else engG.gain.setTargetAtTime(0,t,.05);
 musicTick(!!G.player&&!G.paused&&(G.state==='race'||G.state==='grid'||G.state==='finish'));
}

/* ============ Cheshire Cat ============ */
let voice=null,lastSay=-99,lastLine='',cheshTimer=0;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function speak(text,prio){
 if(!G.voiceOn||!('speechSynthesis' in window))return;
 try{if(prio>=2)speechSynthesis.cancel();else if(speechSynthesis.speaking)return;
  const u=new SpeechSynthesisUtterance(text.replace(/[^\x20-\x7E]/g,' '));u.rate=1.08;u.pitch=.72;u.volume=1;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}
}
function sayRaw(text,prio){
 lastSay=G.clock;lastLine=text;
 $('cheshTxt').textContent=text;$('chesh').classList.add('on');
 clearTimeout(cheshTimer);cheshTimer=setTimeout(()=>$('chesh').classList.remove('on'),Math.min(7000,2800+text.length*55));
 speak(text,prio);
}
function leaderName(){let l=null;for(const r of G.racers)if(!l||r.rank<l.rank)l=r;return l?l.data.name:'Somebody';}
const bags={},recent=[];
function bagPick(key,pool){
 for(let t=0;t<4;t++){
  let b=bags[key];if(!b||!b.length)b=bags[key]=shuffle(pool.map((_,i)=>i));
  const line=pool[b.pop()];
  if(recent.indexOf(line)<0||t===3)return line;
 }
 return pool[0];
}
function say(key,prio,vars){
 if(G.state==='demo'||G.state==='results'||G.state==='menu')return;
 prio=prio||0;
 if(G.clock-lastSay<(prio>=2?.9:prio===1?1.8:3.2))return;
 const pool=CH[key];if(!pool)return;
 let line=bagPick(key,pool);recent.push(line);if(recent.length>18)recent.shift();
 vars=vars||{};if(vars.p==null)vars.p=leaderName();
 sayRaw(line.replace(/\{(\w)\}/g,(m,k)=>vars[k]!=null?vars[k]:''),prio);
}

/* ============ HUD helpers ============ */
const hudCache={};
function setHtml(id,html){if(hudCache[id]!==html){hudCache[id]=html;$(id).innerHTML=html;}}
let msgTimer=0;
function msg(t){const el=$('msg');el.textContent=t;el.classList.add('on');clearTimeout(msgTimer);msgTimer=setTimeout(()=>el.classList.remove('on'),1300);}
function big(t){const el=$('big');el.textContent=t;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}

/* ============ events -> commentary ============ */
function idleSay(p){
 if(G.mode==='tt'){say(Math.random()<.4?'ttidle':CH['idle_'+G.track.id]&&Math.random()<.6?'idle_'+G.track.id:'idle',0);return;}
 const roll=Math.random(),n=G.racers.length;
 const near=G.racers.filter(r=>r!==p&&Math.abs(dm(r.dist,p.dist))<1500);
 if(roll<.34&&CH['idle_'+G.track.id])say('idle_'+G.track.id,0);
 else if(roll<.62&&near.length){const o=pick(near);say('r_'+o.data.id,0,{b:o.data.name});}
 else if(p.rank===1&&leadT>20)say('hold1',0);
 else if(p.rank===n&&lastBk>20)say('hold6',0);
 else say(p.rank===n&&Math.random()<.5?'last':'idle',0);
}
let lastPR=0,leadT=0,lastBk=0,catchCool=0;
function processEvents(dt){
 for(const e of G.evq.splice(0)){
  if(G.rs){if(e.type==='driftBoost')G.rs.drifts++;else if(e.type==='use')G.rs.used++;else if(e.type==='hit'){if(e.a.isPlayer)G.rs.spun++;else if(e.b&&e.b.isPlayer)G.rs.hits++;}}
  switch(e.type){
   case'count':big(String(e.a));sfx('count');if(e.a===2&&G.player)say('who_'+G.player.data.id,2);break;
   case'go':big('GO!');sfx('go');say('go',2);msg((window.matchMedia&&matchMedia('(pointer:coarse)').matches)?(G.scheme==='slide'?'SLIDE LEFT THUMB TO STEER':G.autoDrift?'TAP ITEM TO USE POWER-UPS':'HOLD DRIFT IN A TURN, THEN LET GO!'):'ARROWS STEER · SPACE USES ITEMS');break;
   case'hit':{
    const v=e.a,s=e.b,k=e.c||'apple';
    if(v.isPlayer){msg('SPIN OUT!');flash(.45,'#ff2fd0');sfx('hit');say('hit'+k[0].toUpperCase()+k.slice(1),2);}
    else if(s&&s.isPlayer){msg('NICE HIT!');sfx('throw');say('youHit',2,{b:v.data.name});}
    else if(s&&Math.random()<.45)say('aiHit',0,{a:s.data.name,b:v.data.name});
    break;}
   case'shield':if(e.a.isPlayer){msg('MIRROR SAVED YOU!');sfx('pick');say('shield',2);}break;
   case'got':say('got_'+e.a,0);break;
   case'use':say('use_'+e.a,0);break;
   case'air':say('air',0);break;
   case'mud':msg('MUD!');say('mud',1);break;
   case'bonk':msg('BONK!');sfx('hit');say('bonk',1);break;
   case'pad':if(Math.random()<.3)say('pad',0);break;
   case'driftBoost':if(Math.random()<.5)say('drift',0);break;
   case'lap':big('LAP '+e.a);if(e.a===LAPS){msg('FINAL LAP!');say('lap3',2);}else say('lap2',2);break;
   case'midnight':flash(.8,'#e9e3ff');sfx('bell');msg('MIDNIGHT!');say('midnight',2);break;
   case'gust':msg(G.wind.dir>0?'WIND ▶▶▶':'◀◀◀ WIND');say('gust',2);break;
   case'finish':{const r=e.a.finRank;big(r===1?'WINNER!':'FINISH!');sfx('win');
    say(r===1?'fin1':r===2?'fin2':r===3?'fin3':'finLow',2);break;}
  }
 }
 /* player passes / gets passed, leader changes */
 const p=G.player;
 if(p&&G.state==='race'){
  G.passCool-=dt;
  if(lastPR&&p.rank!==lastPR&&G.passCool<=0){
   const mine=p.rank;
   const other=G.racers.find(r=>r!==p&&r.rank===(p.rank<lastPR?p.rank+1:p.rank-1));
   if(other){say(p.rank<lastPR?'pass':'passed',p.rank<lastPR?1:0,{b:other.data.name});G.passCool=3;}
  }
  lastPR=p.rank;
  const ld=G.racers.find(r=>r.rank===1);
  if(ld&&G.leaderId!==ld.data.id){
   if(G.leaderId&&G.t>6){if(ld===p)say('lead',1);else if(G.leaderId===p.data.id)say('loseLead',1);}
   G.leaderId=ld.data.id;
  }
  if(p.off){G.offT+=dt;if(G.offT>1.1){say('offroad',1);G.offT=-6;}}else if(G.offT>0)G.offT=0;
  leadT=p.rank===1?leadT+dt:0;lastBk=p.rank===G.racers.length?lastBk+dt:0;
  catchCool-=dt;
  if(catchCool<=0&&G.t>8){
   const o=G.racers.find(r=>r.rank===p.rank-1),bk=G.racers.find(r=>r.rank===p.rank+1);
   if(o&&o.dist>p.dist&&o.dist-p.dist<TL*.02&&p.speed>o.speed*1.01){say('catch',1,{b:o.data.name});catchCool=18;}
   else if(bk&&p.dist-bk.dist>TL*.1){say('wide',0,{b:bk.data.name});catchCool=25;}
  }
  if(G.clock-lastSay>5.5)idleSay(p);
 }else lastPR=0;
}

  case'cup':G.mode='cup';showCupSelect();break;

  case'locked':{const q=$('quip');if(q)q.textContent='Finish the Grimm Cup first. The Wicked Cup can wait. It is very good at waiting.';break;}
  case'quick':G.mode='quick';showSelect();break;
  case'tt':G.mode='tt';showSelect();break;
  case'daily':showDaily();break;
  case'dailyGo':G.mode='daily';showSelect();break;
  case'trophies':showTrophies();break;
  case'upg':upgAction(d.k);break;
  case'mirror':G.mirrorSet=!G.mirrorSet;store('mirror',G.mirrorSet);showControls();break;
  case'musicS':G.musicOn=!G.musicOn;store('music',G.musicOn);showControls();break;
  case'music':G.musicOn=!G.musicOn;store('music',G.musicOn);showTitleIfMenu();break;
  case'garage':showGarage();break;
  case'paint':paintAction(d.id);break;
  case'howto':showHow();break;
  case'controls':showControls();break;
  case'diff':G.diff=(G.diff+1)%3;store('diff',G.diff);showControls();break;
  case'ctlScheme':G.scheme=G.scheme==='slide'?'buttons':'slide';applyControls();showControls();break;
  case'ctlAssist':G.assist=!G.assist;applyControls();showControls();break;
  case'ctlDrift':G.autoDrift=!G.autoDrift;applyControls();showControls();break;
  case'ctlBack':if(G.paused)pauseGame2();else showTitle();break;
  case'title':showTitle();break;
  case'voice':G.voiceOn=!G.voiceOn;store('voice',G.voiceOn);if(!G.voiceOn){try{speechSynthesis.cancel();}catch(e){}}if(G.paused)pauseGame2();else showTitleIfMenu();break;
  case'sfx':G.sfxOn=!G.sfxOn;store('sfx',G.sfxOn);showTitleIfMenu();break;
  case'pick':{G.sel=d.id;const st=scr.scrollTop;showSelect();scr.scrollTop=st;break;}
  case'afterSelect':store('racer',G.sel);if(G.mode==='cup'){G.cup.round=0;G.cup.field=pickOpp(Math.random);showCupIntro();}else if(G.mode==='daily'){G.daily=dailyInfo();beginRace(G.daily.track);}else showTrackSelect();break;
  case'track':G.duel=(G.mode==='tt'&&G.duelOn)?{turn:1,times:[]}:null;beginRace(+d.i);break;
  case'shareG':showShare();break;
  case'copyG':copyShare();break;
  case'sendG':sendShare();break;
  case'importG':showImport();break;
  case'doImport':doImport();break;
  case'raceRival':raceRival();break;
  case'backRes':if(G.results)onResults();else showTitle();break;
  case'duelT':G.duelOn=!G.duelOn;showTrackSelect();break;
  case'duelNext':G.duel.turn=2;beginRace(G.trackIdx);break;
  case'go':beginRace(cupTrack(G.cup.round));break;
  case'standings':showStandings();break;
  case'nextRace':G.cup.round++;showCupIntro();break;
  case'again':if(G.duel)G.duel={turn:1,times:[]};beginRace(G.trackIdx);break;
  case'quick2':if(G.mode==='daily')G.mode='quick';showTrackSelect();break;
  case'resume':hideScreen();G.paused=false;break;
  case'quitRace':G.paused=false;showTitle();break;
 }
}

/* ============ input ============ */
function bindBtn(id,on,off){
 const el=$(id);
 const down=e=>{e.preventDefault();initAudio();el.classList.add('down');on();try{el.setPointerCapture(e.pointerId);}catch(_){}};
 const up=e=>{e.preventDefault();el.classList.remove('down');off();};
 el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
 el.addEventListener('contextmenu',e=>e.preventDefault());
}

/* one-thumb slide steering (floating origin) + tap-right-side items */
const sp={id:null,x0:0,range:70};
function resetTouch(){ctl.l=ctl.r=ctl.d=false;ctl.slide=0;sp.id=null;$('stick').classList.add('hide');}
(function(){
 const zl=$('zoneL'),zr=$('zoneR'),stick=$('stick'),knob=$('knob'),hint=$('zhint');
 if(store('hinted'))hint.classList.add('hide');
 zl.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();if(sp.id!==null)return;
  sp.id=e.pointerId;sp.x0=e.clientX;sp.range=clamp(innerWidth*.17,48,86);
  try{zl.setPointerCapture(e.pointerId);}catch(_){}
  stick.style.left=e.clientX+'px';stick.style.top=e.clientY+'px';stick.classList.remove('hide');
  knob.style.transform='translate(-50%,-50%)';
  if(!hint.classList.contains('hide')){hint.classList.add('hide');store('hinted',true);}
 });
 zl.addEventListener('pointermove',e=>{
  if(e.pointerId!==sp.id)return;e.preventDefault();
  let dx=e.clientX-sp.x0;const lim=sp.range*1.35;
  if(dx>lim){sp.x0=e.clientX-lim;dx=lim;}else if(dx<-lim){sp.x0=e.clientX+lim;dx=-lim;}
  const dz=4,v=Math.abs(dx)<dz?0:Math.sign(dx)*(Math.abs(dx)-dz)/(sp.range-dz);
  ctl.slide=clamp(v,-1,1);
  knob.style.transform='translate(calc(-50% + '+clamp(dx,-sp.range,sp.range)+'px),-50%)';
 });
 const end=e=>{if(e.pointerId!==sp.id)return;sp.id=null;ctl.slide=0;stick.classList.add('hide');};
 zl.addEventListener('pointerup',end);zl.addEventListener('pointercancel',end);zl.addEventListener('lostpointercapture',end);
 zl.addEventListener('contextmenu',e=>e.preventDefault());
 zr.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();ctl.itemPress=true;});
 zr.addEventListener('contextmenu',e=>e.preventDefault());
})();
function inputStep(dt){
 const t=(ctl.l?-1:0)+(ctl.r?1:0),rate=t===0?9:4.5;
 ctl.btn+=clamp(t-ctl.btn,-rate*dt,rate*dt);
 ctl.slideS+=(ctl.slide-ctl.slideS)*Math.min(1,dt*14);
 ctl.steer=clamp(ctl.btn+ctl.slideS,-1,1);
}
$('hPause').addEventListener('click',()=>pauseGame());

const KEYS={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',Shift:'d',z:'d',Z:'d'};
addEventListener('keydown',e=>{
 initAudio();
 if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'))return;
 if(KEYS[e.key]){ctl[KEYS[e.key]]=true;e.preventDefault();}
 else if(e.key===' '||e.key==='x'||e.key==='X'||e.key==='ArrowUp'){if(!e.repeat)ctl.itemPress=true;e.preventDefault();}
 else if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(G.paused)act('resume');else pauseGame();}
});

/* ============ main loop ============ */
let lastT=performance.now(),acc=0;
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
 if(!G.paused){
  acc+=dt;let n=0;
  while(acc>=1/60&&n<5){update(1/60);acc-=1/60;n++;}
  if(n===5)acc=0;
  processEvents(dt);
 }
 updateHud();audioTick();
 try{render();}catch(err){if(!loop.err){loop.err=1;console.error('render error',err);}}
}
G.musicOn=store('music')!==false;G.mirrorSet=!!store('mirror');G.voiceOn=store('voice')!==false;G.sfxOn=store('sfx')!==false;
G.sel=store('racer');if(!RACERS.some(r=>r.id===G.sel))G.sel='gingy';
G.diff=store('diff');if(G.diff!==0&&G.diff!==1&&G.diff!==2)G.diff=1;
G.scheme=store('scheme')==='buttons'?'buttons':'slide';G.assist=store('assist')!==false;G.autoDrift=store('autoDrift')!==false;

const racerPortraits={};
function portraitSvg(d){
 const animal=['wolf','fox','puss','bear','pigs','frog','dragon'].includes(d.id);
 const skin={gingy:'#bc713b',wolf:'#8799ad',fox:'#db7538',puss:'#c28a50',bear:'#885437',pigs:'#ed9ca4',frog:'#72b85a',dragon:'#60a188',troll:'#809767',genie:'#6faaca',pinocchio:'#d5a06b'}[d.id]||'#edc4a0';
 let feature='';
 if(animal)feature+='<path d="M29 44 L20 10 L49 29 M79 44 L89 10 L59 29" fill="'+skin+'" stroke="#30273f" stroke-width="4"/>';
 else feature+='<path d="M23 56 Q10 10 53 14 Q96 10 86 66 L73 41 L40 35 Z" fill="'+(d.id==='mermaid'?'#a34448':d.id==='alice'||d.id==='cinder'?'#d9b65b':'#473042')+'"/>';
 if(['cinder','frog','genie'].includes(d.id))feature+='<path d="M32 29 L28 9 L44 19 L54 3 L64 19 L80 9 L75 29 Z" fill="#efd087" stroke="#8d6745" stroke-width="2"/>';
 if(['puss','pinocchio','rumple'].includes(d.id))feature+='<path d="M17 32 L90 32 L73 22 L65 4 L38 9 L34 25 Z" fill="'+d.trim+'" stroke="#49324b" stroke-width="3"/>';
 if(d.id==='dragon')feature+='<path d="M27 27 L27 4 L44 27 M67 27 L82 4 L81 36" fill="#e8cb88"/>';
 let face= d.id==='gingy'?'<path d="M32 44 Q54 29 77 44 M30 62 Q54 82 79 62" fill="none" stroke="#fff1cb" stroke-width="5"/>':animal?'<ellipse cx="54" cy="68" rx="23" ry="14" fill="#efd4b3"/><path d="M47 60 L61 60 L54 67 Z" fill="#30273f"/>':'<path d="M44 72 Q54 79 65 71" fill="none" stroke="#a35c58" stroke-width="3"/>';
 if(d.id==='pinocchio')face+='<path d="M54 58 L90 64 L54 68" fill="#d5a06b" stroke="#966942" stroke-width="2"/>';
 if(d.id==='frog')face+='<circle cx="34" cy="36" r="13" fill="'+skin+'"/><circle cx="74" cy="36" r="13" fill="'+skin+'"/>';
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 118"><defs><linearGradient id="s" x2=".8" y2="1"><stop stop-color="'+skin+'"/><stop offset="1" stop-color="#33253e"/></linearGradient></defs><path d="M13 118 Q12 84 54 86 Q96 84 95 118" fill="'+d.body+'" stroke="#262137" stroke-width="4"/><path d="M39 90 L54 110 L70 90" fill="'+d.trim+'"/>'+feature+'<ellipse cx="54" cy="57" rx="31" ry="34" fill="url(#s)" stroke="#32283d" stroke-width="3"/>'+face+'<ellipse cx="41" cy="52" rx="5" ry="7" fill="#201e30"/><ellipse cx="68" cy="52" rx="5" ry="7" fill="#201e30"/><circle cx="42" cy="50" r="1.8" fill="white"/><circle cx="69" cy="50" r="1.8" fill="white"/>'+ (['cinder','frog','genie','puss','pinocchio','rumple'].includes(d.id)?feature:'')+'</svg>';
}
for(const d of RACERS){const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(portraitSvg(d));racerPortraits[d.id]=im;d.emoji='<img alt="" width="48" height="52" style="vertical-align:middle;object-fit:contain" src="'+im.src+'">';}
function drawRacerPortrait(d,y,u){const im=racerPortraits[d.id];if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,-u*.29,y-u*.35,u*.58,u*.64);}


// Painted sprites share a consistent rear chase-camera perspective.
const paintedKarts={};
for(const d of RACERS){const im=new Image();im.src='assets/racers/'+d.id+'.png';paintedKarts[d.id]=im;d.emoji='<img alt="" width="72" height="72" style="object-fit:contain;vertical-align:middle" src="'+im.src+'">';}
const legacyKart=drawKart;
drawKart=function(x,y,w,r,o){
 const im=paintedKarts[r.data.id];if(!im||!im.complete||!im.naturalWidth){legacyKart(x,y,w,r,o);return;}
 o=o||{};ctx.save();
 if(o.clipY!=null&&o.clipY<y){ctx.beginPath();ctx.rect(0,0,W,Math.max(0,o.clipY));ctx.clip();}
 Ec(x,y,w*.48,w*.075,'rgba(5,4,16,.38)');ctx.translate(x,y-(o.lift||0));
 if(o.spin)ctx.scale(Math.cos(o.spin),1);if(o.tilt)ctx.rotate(o.tilt*.045);
 if(o.boost){ctx.save();ctx.globalCompositeOperation='screen';for(const side of [-1,1]){const flame=ctx.createRadialGradient(side*w*.26,0,1,side*w*.26,w*.16,w*.32);flame.addColorStop(0,'#edfcff');flame.addColorStop(.3,'#56d7ff');flame.addColorStop(1,'#229aff00');ctx.fillStyle=flame;ctx.fillRect(side*w*.26-w*.25,-w*.08,w*.5,w*.55);}ctx.restore();}
 const sw=w*1.16,sh=sw*im.naturalHeight/im.naturalWidth;ctx.drawImage(im,-sw/2,-sh,sw,sh);
 if(r.shield>0){ctx.strokeStyle='rgba(163,228,255,.7)';ctx.lineWidth=Math.max(1,w*.014);ctx.beginPath();ctx.ellipse(0,-sh*.48,w*.63,sh*.6,0,0,Math.PI*2);ctx.stroke();}
 if(o.tag){ctx.font='bold '+Math.round(w*.16)+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#f6dfaa';ctx.fillText(o.tag===true?'YOU':o.tag,0,-sh-w*.08);}ctx.restore();
};


const landscapeImages=TRACKS.map((t,i)=>{const im=new Image();im.src='assets/world/track-'+i+'.jpg';t.em='<img alt="" class="track-thumb" src="'+im.src+'">';return im;});
for(const cup of CUPS)cup.em='<img alt="" class="track-thumb" src="assets/world/track-'+cup.tracks[0]+'.jpg">';
const paintedBackground=drawBackground;
drawBackground=function(T,pal){
 paintedBackground(T,pal);const im=landscapeImages[TRACKS.indexOf(T)];if(!im||!im.complete||!im.naturalWidth)return;
 ctx.save();const dw=W*1.16,dh=Math.max(HY*1.14,dw*im.naturalHeight/im.naturalWidth);const shift=Math.sin(G.bgOff*.0006)*W*.06;
 ctx.drawImage(im,(W-dw)/2+shift,HY-dh,dw,dh);
 if(G.night>.05){ctx.fillStyle='rgba(13,12,45,'+(G.night*.38)+')';ctx.fillRect(0,0,W,HY);}
 ctx.restore();
};
const sceneKeys=['cane','lolli','house','gumdrop','tree','pine','stump','mush','strawhouse','bmush','hoop','card','teapot','flamingo','tower','lamp','pumpkin','clock','tomb','iceshard','palm','cairn','tent','thornvine'];
const sceneImages={};for(const k of sceneKeys){const im=new Image();im.src='assets/scenery/'+k+'.png';sceneImages[k]=im;}
const sceneAliases={snowpine:'pine',deadtree:'tree',gnarl:'tree',hut:'strawhouse',timber:'house',lantern:'lamp',torch:'lamp',spire:'tower',minaret:'tower',pillar:'tower',igloo:'iceshard',snowman:'iceshard',dune:'cairn',volcano:'cairn',stall:'tent',ferris:'tent',rose:'thornvine'};
const oldScenery=sprite;
sprite=function(k,x,y,w,v){const im=sceneImages[sceneAliases[k]||k];if(!im||!im.complete||!im.naturalWidth){oldScenery(k,x,y,w,v);return;}ctx.save();const sw=w*(k==='house'?1.15:1),sh=sw*im.naturalHeight/im.naturalWidth;ctx.drawImage(im,x-sw/2,y-sh,sw,sh);ctx.restore();};
const roadTiles=[];for(let i=0;i<4;i++){const im=new Image();im.src='assets/world/road-'+i+'.jpg';roadTiles.push(im);}
const texturedSegment=drawSegment;
drawSegment=function(seg,pal,n){texturedSegment(seg,pal,n);if(seg.pad||seg.index<2)return;const a=seg.p1.screen,b=seg.p2.screen;if(a.y-b.y<1||a.w<1)return;
 const bg=G.track.bg;const material=['ice','mount'].includes(bg)?2:['sea','nlnd'].includes(bg)?3:['forest','swamp','desert','sky'].includes(bg)?1:0;const im=roadTiles[material];if(!im.complete||!im.naturalWidth)return;
 ctx.save();ctx.beginPath();ctx.moveTo(a.x-a.w,a.y+1);ctx.lineTo(a.x+a.w,a.y+1);ctx.lineTo(b.x+b.w,b.y);ctx.lineTo(b.x-b.w,b.y);ctx.closePath();ctx.clip();ctx.globalAlpha=.38;
 const left=Math.min(a.x-a.w,b.x-b.w),right=Math.max(a.x+a.w,b.x+b.w);const sy=(seg.index%32)/32*im.naturalHeight;
 ctx.drawImage(im,0,sy,im.naturalWidth,im.naturalHeight/32,left,b.y,right-left,a.y-b.y+1);ctx.restore();};
const artScreen=showScreen;
showScreen=function(html,clear){artScreen(html,clear);const walker=document.createTreeWalker(scr,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes)node.textContent=node.textContent.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'');
 const logo=scr.querySelector('.logo');if(logo){scr.classList.add('title-screen');const grin=scr.querySelector('.grin');if(grin)grin.innerHTML='<span class="crest">GP</span>';}else scr.classList.remove('title-screen');
};

applyControls();
resize();
startRace(0,true);
showTitle();
checkHashImport();
requestAnimationFrame(loop);
window.__GP={G:G,ctl:ctl,startRace:startRace,beginRace:beginRace,act:act,update:update};
/* Atmosphere pass: deliberately bounded drawing work for mobile devices. */
const originalSegment=drawSegment;
drawSegment=function(seg,pal,n){
 originalSegment(seg,pal,n);
 const a=seg.p1.screen,b=seg.p2.screen;
 if(a.y-b.y<1)return;
 ctx.save();
 // A crowned road surface, with recessed edges and a softly lit center.
 const sheen=ctx.createLinearGradient(a.x-a.w,0,a.x+a.w,0);
 sheen.addColorStop(0,'rgba(7,8,25,.28)');sheen.addColorStop(.18,'rgba(10,12,28,.08)');sheen.addColorStop(.48,'rgba(220,224,255,.07)');sheen.addColorStop(.8,'rgba(10,12,28,.08)');sheen.addColorStop(1,'rgba(7,8,25,.28)');
 poly(a.x-a.w,a.y+1,a.x+a.w,a.y+1,b.x+b.w,b.y,b.x-b.w,b.y,sheen);
 for(const side of [-1,1])poly(a.x+side*a.w*.97,a.y+1,a.x+side*a.w*.985,a.y+1,b.x+side*b.w*.985,b.y,b.x+side*b.w*.97,b.y,'rgba(255,239,199,.48)');
 ctx.restore();
};
